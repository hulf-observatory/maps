:root {

main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 640px; padding: 48px 0; }
h1 { font: 400 24px/1.25 var(--font-brand); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; }
p { margin: 0 0 24px; color: var(--text-2); }
@media (min-width: 768px) { h1 { font-size: 30px; } p { font-size: 16px; } }
